---
name: 'Release Cookie-Law-Consent plugin'

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Nodejs dependencies
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install node dependencies
        shell: bash
        run: yarn install --frozen-lockfile
      - name: Build assets
        shell: bash
        run: yarn build:production

      # The payload is an allowlist: only the paths named below ship, everything
      # else in the checkout stays behind. Adding a file to the repo root can no
      # longer leak it into the zip. Forgetting a path the plugin needs at runtime
      # breaks it visibly in testing, and rsync exits non-zero on a path that is
      # missing entirely, so the release fails rather than publishing a zip
      # without dist/.
      #
      # Add an entry here only when the plugin needs it at runtime. Development
      # tooling (webpack.config.js, package.json, yarn.lock, composer.json,
      # composer.lock), documentation (README.md, CHANGELOG.md, docs/) and agent
      # files (AGENTS.md, CLAUDE.md) do not. admin/ ships whole for
      # admin/settings-page.php, so it also carries admin/src/, the sources
      # webpack builds into dist/. Composer's vendor/ does not ship either: no
      # PHP file loads it, and composer/installers only acts in the project that
      # installs this package through Composer.
      - name: Assemble plugin payload
        shell: bash
        run: |
          mkdir -p cookie-law-consent
          rsync -r --files-from=- . ./cookie-law-consent <<'EOF'
          cookie-law-consent.php
          cookie-law-consent-api.php
          available-services.php
          index.php
          uninstall.php
          readme.txt
          admin/
          public/
          dist/
          languages/
          EOF
      - name: Archive Release
        uses: montudor/action-zip@v1
        with:
          args: zip -qq -r cookie-law-consent.zip cookie-law-consent

      # Release
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" cookie-law-consent.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

      # release-belt reads the version from the file name (<name>-<tag>.zip). The
      # GitHub release keeps its cookie-law-consent.zip asset, which the README
      # install steps refer to; only the upload below uses this versioned copy.
      - name: Name the zip for release-belt
        shell: bash
        run: cp cookie-law-consent.zip "cookie-law-consent-$GITHUB_REF_NAME.zip"

      # release-belt's SSH host key is pinned, so the upload only goes to the real
      # server: without it ssh-deploy connects with StrictHostKeyChecking=no and
      # trusts whatever key it is shown. The key comes from the
      # RELEASE_BELT_KNOWN_HOSTS organization secret: the `ssh-keyscan -p <port>
      # <host>` line(s) (`-H` hashed lines work too), checked against the
      # fingerprints from `ssh-keygen -lf /etc/ssh/ssh_host_*_key.pub` on the
      # server by someone with access to it.
      #
      # When release-belt's host key changes, the upload fails with "Host key
      # verification failed" (and the fingerprints logged below no longer match
      # the server's). Replace the secret with the new, verified line(s); don't
      # switch the check off.
      - name: Pin release-belt's SSH host key
        shell: bash
        env:
          KNOWN_HOSTS: ${{ secrets.RELEASE_BELT_KNOWN_HOSTS }}
        run: |
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::The RELEASE_BELT_KNOWN_HOSTS organization secret is missing or empty, so release-belt's SSH host key can't be verified. Create it (see the comment above this step), then upload the release's cookie-law-consent.zip by hand: re-running the job stops at \"Publish GitHub release\"."
            exit 1
          fi
          umask 077
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/release_belt_known_hosts"
          if ! fingerprints=$(ssh-keygen -lf "$RUNNER_TEMP/release_belt_known_hosts"); then
            echo "::error::RELEASE_BELT_KNOWN_HOSTS holds no valid known_hosts line (expected \`ssh-keyscan -p <port> <host>\` output)."
            exit 1
          fi
          # Bits, fingerprint and key type only, to compare with the server's.
          awk '{ print $1, $2, $NF }' <<<"$fingerprints"

      # Pinned to a commit SHA, with the release it resolves to in a comment: a tag
      # can be moved to other code, and this job holds `contents: write` and the
      # release-belt SSH key.
      #
      # SSH_CMD_ARGS replaces the action's `-o StrictHostKeyChecking=no` default:
      # the action splits it on commas and appends the options to rsync's `--rsh`
      # ssh command, which then trusts only the file written above. Don't set
      # SCRIPT_BEFORE/SCRIPT_AFTER: the action runs those over a separate ssh
      # command with StrictHostKeyChecking=no hardcoded, ignoring SSH_CMD_ARGS.
      #
      # If this step fails, the GitHub release is already published, and re-running
      # the job stops at "Publish GitHub release" (the release exists). Upload the
      # release's cookie-law-consent.zip by hand under the TARGET name below.
      - name: Upload to release-belt
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.RELEASE_BELT_PUBLISH_PRIVATE_KEY }}
          REMOTE_USER: ${{ secrets.RELEASE_BELT_USER }}
          REMOTE_HOST: ${{ secrets.RELEASE_BELT_HOST }}
          REMOTE_PORT: ${{ secrets.RELEASE_BELT_PORT }}
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=yes, -o UserKnownHostsFile=${{ runner.temp }}/release_belt_known_hosts, -o GlobalKnownHostsFile=/dev/null"
          SOURCE: cookie-law-consent-${{ github.ref_name }}.zip
          TARGET: "${{ secrets.RELEASE_BELT_PATH }}/releases/wordpress-plugin/superhuit/cookie-law-consent-${{ github.ref_name }}.zip"
