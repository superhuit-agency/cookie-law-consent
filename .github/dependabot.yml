# Dependabot reads this file from the default branch (master) only, and only
# opens security updates against master. master-v1 gets version updates via
# `target-branch` and a vulnerability check via workflows/security-audit.yml.
# See docs/adr/0001-dependency-security-per-branch.md.
version: 2

updates:
  # master (2.x): security updates only.
  # `open-pull-requests-limit: 0` disables version updates; security updates
  # are unaffected and are grouped into one PR per ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies, v2]
    commit-message:
      prefix: "chore(2.x): ⬆️"
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies, v2]
    commit-message:
      prefix: "chore(2.x): ⬆️"
    groups:
      composer-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies, v2]
    commit-message:
      prefix: "chore(2.x): ⬆️"
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # master-v1 (1.x): weekly version updates, minor + patch grouped per
  # ecosystem, majors as individual PRs.
  - package-ecosystem: npm
    directory: /
    target-branch: master-v1
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, v1]
    commit-message:
      prefix: "chore(1.x): ⬆️"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /
    target-branch: master-v1
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, v1]
    commit-message:
      prefix: "chore(1.x): ⬆️"
    groups:
      composer-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: master-v1
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, v1]
    commit-message:
      prefix: "chore(1.x): ⬆️"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
